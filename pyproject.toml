[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.2.1"
description = "A checkpointable, observable, and evaluable Agent runtime with MCP and Docker sandbox support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Harness Contributors" }]
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "docker>=7.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "orjson>=3.10.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-json-logger>=3.2.0",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "tenacity>=9.0.0",
  "typer>=0.15.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.9.0",
]

[project.scripts]
agent-harness = "agent_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109", "ASYNC240"]
